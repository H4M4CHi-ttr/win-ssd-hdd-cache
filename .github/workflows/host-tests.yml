{
  "name": "Portable host checks",
  "on": {
    "push": { "branches": ["main"] },
    "pull_request": {}
  },
  "permissions": { "contents": "read" },
  "jobs": {
    "host": {
      "name": "Host (${{ matrix.os }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": { "os": ["ubuntu-24.04", "windows-2025"] }
      },
      "defaults": { "run": { "shell": "bash" } },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": { "persist-credentials": false }
        },
        {
          "name": "Install pinned Rust",
          "run": "rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update"
        },
        {
          "name": "Record toolchain",
          "run": "rustc --version --verbose\ncargo --version"
        },
        { "name": "Format", "run": "cargo fmt --all -- --check" },
        {
          "name": "Lint",
          "run": "cargo clippy --all-targets --locked -- -D warnings"
        },
        {
          "name": "Require nonzero tests",
          "run": "set -euo pipefail\ncargo test --locked -- --list > \"$RUNNER_TEMP/host-test-list.txt\"\ngrep -E ': test[[:space:]]*$' \"$RUNNER_TEMP/host-test-list.txt\""
        },
        {
          "name": "Test",
          "run": "set -euo pipefail\ncargo test --locked | tee \"$RUNNER_TEMP/host-test-results.txt\"\ngrep -E '^test result: ok\\. [1-9][0-9]* passed;' \"$RUNNER_TEMP/host-test-results.txt\""
        },
        { "name": "Planning", "run": "cargo xtask check-planning" }
      ]
    }
  }
}
