[workspace]
members = ["crates/cache-types", "crates/cache-model", "crates/cache-cli", "xtask"]
default-members = ["crates/cache-types", "crates/cache-model", "crates/cache-cli", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }
